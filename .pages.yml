# Pages CMS configuration: https://pagescms.org
# Field names/enums here MUST match the Zod schema in src/content.config.ts.

media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    filename: '{primary}.md'
    view:
      fields: [title, category, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
        description: One-sentence summary shown in listings and previews.
      - name: pubDate
        label: Published date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated date
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        required: true
        default: learning
        options:
          values:
            - { value: tech, label: Tech & Building }
            - { value: work, label: Work & Leadership }
            - { value: home, label: Home & Yard }
            - { value: recipes, label: Recipes }
            - { value: food-travel, label: Food & Travel }
            - { value: family, label: Family & Relationships }
            - { value: money, label: Money }
            - { value: faith, label: Faith & Life }
            - { value: learning, label: Learning }
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: heroImage
        label: Hero image
        type: image
        required: false
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Drafts are hidden from the live site.
      - name: body
        label: Body
        type: rich-text

  - name: toTry
    label: Recipes to Try
    type: collection
    path: src/content/to-try
    filename: '{primary}.md'
    view:
      fields: [title, source, addedDate, tried]
      primary: title
      sort: [addedDate, title]
      default:
        sort: addedDate
        order: desc
    fields:
      - name: title
        label: Recipe
        type: string
        required: true
      - name: url
        label: Link
        type: string
        required: false
        description: Full link to the recipe (https://...).
      - name: source
        label: Source
        type: string
        required: false
        description: Where it's from, e.g. NYT Cooking, Mom, a cookbook.
      - name: note
        label: Why I want to try it
        type: text
        required: false
      - name: addedDate
        label: Date added
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tried
        label: Tried
        type: boolean
        default: false
        description: Check once you've made it. It moves to the Tried list.
      - name: post
        label: Write-up post slug
        type: string
        required: false
        description: If you wrote about it, the post's file name without .md (e.g. best-salmon-traeger).
